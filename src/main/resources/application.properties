# =============================
# APPLICATION
# =============================
spring.application.name=forum-backend
server.port=9090
server.servlet.context-path=/forum

# =============================
# DATABASE - MySQL
# =============================
spring.datasource.url=jdbc:mysql://localhost:3306/tradingsimulateur?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================
# JPA / HIBERNATE
# =============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# =============================
# MULTIPART (UPLOAD D'IMAGES) ? OBLIGATOIRE !
# =============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# =============================
# CORS
# =============================
cors.allowed-origins=http://localhost:4200

# =============================
# WEBSOCKET
# =============================
spring.websocket.enabled=true