<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent de Gestion des Réclamations</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 12L11 14L15 10" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#4FC3F7" stroke-width="2"/>
                </svg>
                <h1>ClaimSmart Agent</h1>
            </div>
        </header>

        <main class="main-content">
            <section class="reclamation-analysis">
                <h2>Analyse de Réclamation</h2>
                <div class="form-group">
                    <label for="reclamation-text">Texte de la réclamation:</label>
                    <textarea id="reclamation-text" placeholder="Écrivez la réclamation ici..."></textarea>
                </div>
                <button id="analyze-btn" class="btn-primary">Analyser</button>

                <div class="results-section">
                    <h3>Résultats:</h3>
                    <div class="result-card">
                        <h4>Catégorie:</h4>
                        <p id="category-result">-</p>
                    </div>
                    <div class="result-card">
                        <h4>Priorité:</h4>
                        <p id="sentiment-result">-</p>
                    </div>
                    <div class="result-card">
                        <h4>Réponse Générée:</h4>
                        <p id="response-result">-</p>
                    </div>
                </div>
            </section>

            <section class="batch-analysis">
                <h2>Traitement par Lot</h2>
                <div class="form-group">
                    <label for="batch-text">Réclamations (une par ligne):</label>
                    <textarea id="batch-text" placeholder="Réclamation 1&#10;Réclamation 2&#10;Réclamation 3"></textarea>
                </div>
                <button id="batch-analyze-btn" class="btn-primary">Analyser le Lot</button>

                <div class="batch-results">
                    <h3>Résultats du Lot:</h3>
                    <table id="batch-results-table">
                        <thead>
                            <tr>
                                <th>Réclamation</th>
                                <th>Catégorie</th>
                                <th>Priorité</th>
                                <th>Réponse Générée</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Batch results will be populated here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; 2023 ClaimSmart Agent. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
