<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reclamation Chat</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">⚡</span>
        <h1>Reclamation Support Bot</h1>
      </div>
      <div class="status" id="backend-status">Backend: unknown</div>
    </header>

    <main class="chat">
      <div id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></div>

      <form id="composer" class="composer" autocomplete="off">
        <input id="message-input" type="text" placeholder="Type your claim or question..." aria-label="Message" required />
        <button id="send-btn" type="submit" class="btn-primary">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
